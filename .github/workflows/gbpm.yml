name: gbpm

on:
  pull_request:
    paths:
      - 'tools/gbpm/**'
      - '.github/workflows/gbpm.yml'
  push:
    branches: [main]
    tags: ['gbpm-v*']
    paths:
      - 'tools/gbpm/**'
      - '.github/workflows/gbpm.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: gbpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            name: gbpm-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            name: gbpm-linux-aarch64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: gbpm-darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Check formatting and run tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          cargo fmt --manifest-path tools/gbpm/Cargo.toml --check
          cargo test --locked --manifest-path tools/gbpm/Cargo.toml
          bash -n tools/gbpm/install.sh
          python3 tools/gbpm/tests/install.py

      - name: Build
        working-directory: tools/gbpm
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p dist
          cp "tools/gbpm/target/$TARGET/release/gbpm" dist/gbpm
          tar -czf "$ARCHIVE_NAME.tar.gz" -C dist gbpm

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'gbpm-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify the version tag
        run: |
          expected=$(python3 -c 'import tomllib; print("gbpm-v" + tomllib.load(open("tools/gbpm/Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "$expected"
      - uses: actions/download-artifact@v4
        with:
          pattern: gbpm-*
          path: dist
          merge-multiple: true
      - name: Publish standalone CLI binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for target in linux-x86_64 linux-aarch64 darwin-aarch64; do
            test -s "dist/gbpm-$target.tar.gz"
          done
          if gh release view -- "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload --clobber -- "$GITHUB_REF_NAME" dist/gbpm-*.tar.gz
          else
            gh release create "$GITHUB_REF_NAME" dist/gbpm-*.tar.gz \
              --verify-tag --latest=false \
              --title "gbpm ${GITHUB_REF_NAME#gbpm-v}" \
              --notes 'Standalone gbpm binaries. Requires FFmpeg in PATH.'
          fi
